<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;

            /* Aesthetic background */
            background:
                radial-gradient(circle at 15% 20%, #f8d9e8 0%, transparent 30%),
                radial-gradient(circle at 85% 80%, #dcd6f7 0%, transparent 32%),
                linear-gradient(135deg, #fff8f4, #f7f1fb, #eef1ff);
        }

        /* Decorative circles */
        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(2px);
            z-index: -1;
        }

        body::before {
            width: 180px;
            height: 180px;
            background: #f3c6dc;
            top: 8%;
            left: 8%;
            opacity: 0.45;
        }

        body::after {
            width: 220px;
            height: 220px;
            background: #c9c4ef;
            bottom: 5%;
            right: 7%;
            opacity: 0.45;
        }

        /* Main form */
        .form-card {
            width: 430px;
            padding: 42px 40px;

            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.9);

            border-radius: 30px;

            box-shadow:
                0 20px 60px rgba(110, 91, 130, 0.15);

            backdrop-filter: blur(18px);
        }

        /* Heading */
        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 62px;
            height: 62px;
            margin: 0 auto 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 20px;

            background: linear-gradient(
                135deg,
                #d9a7c7,
                #a9a1d6
            );

            color: white;
            font-size: 27px;

            box-shadow:
                0 10px 25px rgba(169, 161, 214, 0.3);
        }

        .heading h1 {
            color: #493b52;
            font-size: 29px;
            margin-bottom: 7px;
            font-weight: 700;
        }

        .heading p {
            color: #8c7d91;
            font-size: 13px;
        }

        /* Form groups */
        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            color: #5c4d62;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-box {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);

            color: #a58aab;
            font-size: 17px;
        }

        input {
            width: 100%;
            height: 50px;

            padding: 0 15px 0 44px;

            border: 1px solid #e4dce8;
            border-radius: 13px;

            outline: none;

            background: rgba(255, 255, 255, 0.8);

            color: #514357;
            font-size: 13px;

            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #b5aab9;
        }

        input:focus {
            border-color: #c49abb;

            background: white;

            box-shadow:
                0 0 0 3px rgba(196, 154, 187, 0.12);
        }

        /* Error */
        .error {
            color: #c47b91;
            font-size: 11px;
            margin-top: 5px;
            min-height: 15px;
        }

        /* Button */
        button {
            width: 100%;
            height: 51px;

            border: none;
            border-radius: 14px;

            margin-top: 4px;

            background: linear-gradient(
                135deg,
                #c792b4,
                #9b95c9
            );

            color: white;

            font-size: 14px;
            font-weight: 600;

            letter-spacing: 0.3px;

            cursor: pointer;

            box-shadow:
                0 9px 22px rgba(157, 143, 190, 0.25);

            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 13px 28px rgba(157, 143, 190, 0.35);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Bottom text */
        .bottom-text {
            text-align: center;
            margin-top: 20px;

            color: #a092a5;
            font-size: 11px;
        }

        .bottom-text span {
            color: #a47799;
            font-weight: 600;
        }

        /* Mobile */
        @media (max-width: 500px) {
            body {
                padding: 18px;
            }

            .form-card {
                width: 100%;
                padding: 32px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="form-card">

        <div class="heading">

            <div class="logo">♡</div>

            <h1>Create Account</h1>

            <p>Let's create something beautiful together</p>

        </div>


        <form id="registrationForm">

            <!-- Username -->
            <div class="form-group">

                <label for="username">Username</label>

                <div class="input-box">

                    <span class="input-icon">♙</span>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                    >

                </div>

                <div id="usernameError" class="error"></div>

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">Email Address</label>

                <div class="input-box">

                    <span class="input-icon">♡</span>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                    >

                </div>

                <div id="emailError" class="error"></div>

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">Password</label>

                <div class="input-box">

                    <span class="input-icon">♢</span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                    >

                </div>

                <div id="passwordError" class="error"></div>

            </div>


            <button type="submit">
                Create Account  ✦
            </button>

        </form>


        <div class="bottom-text">
            Your details are <span>safe & secure</span>
        </div>

    </div>


    <script src="validation.js"></script>

</body>
</html>
