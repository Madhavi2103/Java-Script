
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Operations</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at 15% 20%, #ffd9e8, transparent 30%),
                radial-gradient(circle at 85% 80%, #d8d2ff, transparent 30%),
                linear-gradient(135deg, #fff8f5, #f5f0ff);
        }

        .form-box {
            width: 450px;
            padding: 40px;

            background: rgba(255, 255, 255, 0.85);
            border-radius: 25px;

            box-shadow: 0 20px 50px rgba(100, 80, 120, 0.18);
        }

        h1 {
            text-align: center;
            color: #55445d;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #988b9f;
            font-size: 13px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            color: #5c4e63;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 14px;

            border: 1px solid #ded5e5;
            border-radius: 12px;

            outline: none;
            background: #fffdfd;

            color: #55445d;
            font-size: 14px;

            margin-bottom: 18px;
        }

        input:focus {
            border-color: #b99bc5;
        }

        .operation-title {
            text-align: center;
            color: #66576e;
            font-size: 14px;
            font-weight: 600;
            margin: 8px 0 14px;
        }

        .operations {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .operation {
            height: 48px;

            border: none;
            border-radius: 12px;

            background: #eee7f4;
            color: #65536e;

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;
            transition: 0.25s;
        }

        .operation:hover {
            background: #d8c9e1;
            transform: translateY(-2px);
        }

        .operation:last-child {
            grid-column: 1 / 3;
        }

        .answer {
            margin-top: 22px;
        }

        #result {
            background: #f7f2fa;
            color: #80618c;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .clear {
            width: 100%;
            height: 45px;

            border: none;
            border-radius: 12px;

            background: #c49db9;
            color: white;

            font-weight: 600;
            cursor: pointer;
        }

        .clear:hover {
            background: #ae83a3;
        }
    </style>
</head>

<body>

    <div class="form-box">

        <h1>Arithmetic Operations</h1>

        <p class="subtitle">
            Enter two numbers and choose an operation
        </p>

        <label>First Number</label>

        <input
            type="number"
            id="num1"
            placeholder="Enter first number"
        >

        <label>Second Number</label>

        <input
            type="number"
            id="num2"
            placeholder="Enter second number"
        >

        <div class="operation-title">
            Select Operation
        </div>

        <div class="operations">

            <button class="operation" onclick="calculate('+')">
                Addition (+)
            </button>

            <button class="operation" onclick="calculate('-')">
                Subtraction (-)
            </button>

            <button class="operation" onclick="calculate('*')">
                Multiplication (×)
            </button>

            <button class="operation" onclick="calculate('/')">
                Division (÷)
            </button>

            <button class="operation" onclick="calculate('%')">
                Modulus (%)
            </button>

        </div>

        <div class="answer">

            <label>Answer</label>

            <input
                type="text"
                id="result"
                placeholder="Answer will appear here"
                readonly
            >

        </div>

        <button class="clear" onclick="clearForm()">
            Clear
        </button>

    </div>


    <script>

        function calculate(operator) {

            let a = parseFloat(
                document.getElementById("num1").value
            );

            let b = parseFloat(
                document.getElementById("num2").value
            );

            let resultBox =
                document.getElementById("result");

            if (isNaN(a) || isNaN(b)) {
                resultBox.value =
                    "Please enter both numbers.";
                return;
            }

            let result;

            switch (operator) {

                case "+":
                    result = a + b;
                    break;

                case "-":
                    result = a - b;
                    break;

                case "*":
                    result = a * b;
                    break;

                case "/":

                    if (b === 0) {
                        resultBox.value =
                            "Cannot divide by zero.";
                        return;
                    }

                    result = a / b;
                    break;

                case "%":

                    if (b === 0) {
                        resultBox.value =
                            "Cannot use zero.";
                        return;
                    }

                    result = a % b;
                    break;
            }

            resultBox.value = result;
        }


        function clearForm() {

            document.getElementById("num1").value = "";
            document.getElementById("num2").value = "";
            document.getElementById("result").value = "";

        }

    </script>

</body>
</html>
