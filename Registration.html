
<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #d8b4fe, #bfdbfe, #fbcfe8);
            min-height: 100vh;
            animation: fadeIn 1s ease;
        }

        .container {
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(50, 30, 80, 0.2);
            animation: slideIn 0.8s ease;
        }

        h1 {
            margin: 0;
            color: #4c1d95;
            font-size: 34px;
            letter-spacing: 1px;
        }

        .description {
            color: #6b7280;
            margin-top: 8px;
            margin-bottom: 30px;
            font-size: 16px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            color: #374151;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #c4b5fd;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
            background-color: #faf5ff;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #7c3aed;
            background-color: white;
            box-shadow: 0 0 12px rgba(124, 58, 237, 0.2);
            transform: translateY(-2px);
        }

        .terms {
            margin-top: 25px;
            color: #6b7280;
            font-size: 15px;
        }

        .terms span {
            color: #6d28d9;
            font-weight: bold;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(90deg, #7c3aed, #db2777);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.35);
        }

        button:active {
            transform: scale(0.98);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>REGISTER</h1>

        <p class="description">
            Please fill in this form to create an account
        </p>

        <form>

            <label>Email</label>
            <input type="email" placeholder="Enter Email" required>

            <label>Password</label>
            <input type="password" placeholder="Enter Password" required>

            <label>Repeat Password</label>
            <input type="password" placeholder="Repeat Password" required>

            <p class="terms">
                By creating an account you agree to our
                <span>Terms & Privacy</span>.
            </p>

            <button type="submit">Register</button>

        </form>

    </div>

</body>
</html>
